# Build the site on every push. Nothing did this before, and the gap had a cost.
#
# On 18 Aug 2026 the v1.4 publish moved the frozen definition into scripts/monitor_root.py,
# which resolves the ai-monitor working tree at import. build.py imports only the three
# definition constants and never opens that tree, but the import alone made it refuse to
# start wherever the tree is absent -- which is every GitHub runner. The push was green
# because nothing here runs on a push, and the failure surfaced about thirty hours later as
# an emailed scheduled-job failure, by which time the daily site refresh had missed two runs.
#
# The rule this encodes: the runner is the honest environment. A laptop has Magnus's
# Workspace, his Homebrew tectonic and his data checkouts, so a script that quietly depends
# on one of them still passes there. Here it does not.
name: build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: build.py derives the DATA UPDATED stamp from git log over the numeric
      # data files, and a shallow clone has none, so the stamp would fall back to mtime.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install "PyYAML~=6.0"

      # The one-pager sheets are typeset, so without this build.py keeps whatever PDFs are
      # committed and says nothing. Installing it here means the LaTeX path is exercised on
      # every push rather than only on the two scheduled jobs.
      - name: Install tectonic
        run: |
          # PINNED, and pinned to the version on Magnus's laptop. The installer at
          # drop-sh.fullyjustified.net fetches whatever is newest, so the laptop sat on 0.15.0
          # while the runners moved to 0.17.0 and the two typeset from DIFFERENT TeX bundles --
          # a difference nobody could see, because until 24 Aug 2026 the runners never managed
          # to typeset the sheet at all. Same binary both places, or "it builds on my machine"
          # means nothing. Bump both together, or not at all.
          curl -fsSL -o tectonic.tar.gz \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz
          tar xzf tectonic.tar.gz && rm tectonic.tar.gz
          sudo mv ./tectonic /usr/local/bin/tectonic
          tectonic --version

      # DELIBERATELY WITHOUT $AI_MONITOR_ROOT. build.py must build from this repository
      # alone; the ai-monitor checkout is what the refresh scripts read, and they run in the
      # scheduled jobs where that checkout exists. If build.py ever needs it again, that is a
      # design change to argue for, not a thing to discover from a red scheduled run.
      # poppler-utils, for pdfinfo. build_onepager.py counts the sheet's pages after typesetting
      # it, because a third page means copy overflowed and LaTeX says nothing when it does. That
      # check shells out to pdfinfo, which a runner does not have, so the script died on
      # FileNotFoundError AFTER tectonic had produced a perfectly good PDF. It surfaced only
      # once the font was portable and the real error underneath could be reached; before that
      # it was hidden behind "tectonic failed", printed without its diagnostics.
      - name: Install poppler-utils (build_onepager counts pages with pdfinfo)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Build without the ai-monitor checkout
        run: |
          touch "$RUNNER_TEMP/build-started"
          python3 build.py

      # Not `-newermt '-30 minutes'`, which is what this said until 24 Aug 2026 and which could
      # not fail: actions/checkout stamps every file with the checkout time, so each PDF was
      # always "modified in the last 30 minutes" whether or not the build had touched it. The
      # step printed "both sheets regenerated" on every run for as long as it existed, while
      # the sheets were in fact never typeset here at all -- Avenir Next is a macOS system font
      # and no runner has it. A guard written to catch a silent failure has to be newer than
      # the checkout, so it is a marker made immediately before the build.
      - name: Both one-pagers were typeset by this run
        run: |
          for f in docs/aiel-monitor-onepager.pdf docs/aiel-monitor-onepager-sv.pdf; do
            if [ -z "$(find "$f" -newer "$RUNNER_TEMP/build-started" 2>/dev/null)" ]; then
              echo "::error::$f was not regenerated by this run"; exit 1
            fi
          done
          echo "both sheets regenerated"

      # Labels are the one thing a build cannot get wrong quietly: a clipped or crowded chart
      # is valid HTML and a clean build. See scripts/check_label_lengths.py.
      - name: Chart labels fit, and do not crowd the chart
        run: python3 scripts/check_label_lengths.py

      - name: Stored short labels match the rule
        run: python3 scripts/check_label_columns.py

      - name: Every internal link resolves
        run: python3 scripts/check_links.py

      - name: Every module states the unit it is computed on
        run: python3 scripts/check_claims.py

      # The refresh scripts are not run here (they need the ai-monitor checkout and the
      # network), but they must at least still import: an ImportError, a syntax error or a
      # module-level side effect in one of them otherwise waits for its schedule to be found.
      - name: Label shortener behaves
        run: python3 scripts/test_labels.py

      - name: Every refresh script imports
        env:
          AI_MONITOR_ROOT: ${{ github.workspace }}
        run: python3 scripts/check_imports.py
