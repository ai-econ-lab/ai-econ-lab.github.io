name: Monthly Brief draft

# Drafts NEXT month's AIEL Monitor Brief and emails it to Magnus for review,
# ~two weeks ahead of publication. Issues publish on the 12th, so the draft
# goes out on the 28th of the prior month. Also runnable on demand.
on:
  schedule:
    # Runs DAILY and exits in ~16s unless it is the 28th; scripts/email_brief_draft.py
    # holds the day guard. Deliberately not "0 7 28 * *": GitHub drops rare cron
    # schedules under load, and that monthly form silently failed to fire on
    # 28 Jul 2026. Missing a monthly slot costs a whole issue, since the retry is a
    # month later, after publication. Daily is the reliable shape.
    - cron: "0 7 * * *"        # 07:00 UTC (~09:00 Europe/Stockholm)
  workflow_dispatch: {}        # manual "Run workflow" button; bypasses the day guard

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # PyYAML is what build.py needs; pinned so a new major cannot take out a
      # draft whose retry is a month away, after the issue has published.
      - run: pip install "PyYAML~=6.0"
      - name: Build next month's brief and email it
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 scripts/email_brief_draft.py
