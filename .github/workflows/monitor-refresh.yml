# Weekly Monitor source refresh — keeps the site's promise that sources are
# checked on a schedule, whether or not anyone is at a keyboard.
#
#   auto-apply : scripts/weekly_refresh.py  (Eurostat, SCB pulls + sanity gates)
#   watchers   : scripts/check_sources.py   (AI Index, DAIOE, EU-LFS, SCB AMU
#                -> GitHub issue on a new release, state in watch_state.json)
#
# Design: refresh and watch both run with continue-on-error so that one flaky
# API cannot block the other, the rebuild, or the commit of good results; the
# last step then turns the run red if anything failed, which makes GitHub
# email the maintainer. A failed sanity gate restores the data file from git,
# so a broken pull can never publish itself.
name: monitor-refresh
on:
  schedule:
    - cron: "17 5 * * 1"    # Mondays 05:17 UTC — before the European workday
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: monitor-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: build.py derives the DATA UPDATED stamp from git log on
          # the data files. A shallow clone has no history, so the stamp would fall
          # back to checkout mtime = "today" and churn docs/ every run.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # PyYAML is the only third-party import in the whole chain (weekly_refresh
      # and the five refresh_* scripts it shells out to). Pinned: an unpinned
      # install lets a new major silently take the Monday refresh down.
      - run: pip install "PyYAML~=6.0"

      - name: Auto-apply refresh (Eurostat, SCB)
        id: refresh
        continue-on-error: true
        run: python scripts/weekly_refresh.py

      - name: Watch human-step sources (AI Index, DAIOE, EU-LFS, SCB AMU)
        id: watch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_sources.py

      - name: Rebuild site
        run: python build.py

      # After the rebuild, because it reads the BUILT page: that is what a reader sees and
      # what the Brief inherits. Before the commit, so a page that claims a counting unit it
      # is not computed on never reaches the live site.
      - name: Check every module states the unit it is computed on
        id: claims
        continue-on-error: true
        run: python scripts/check_claims.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" || {
            git commit -m "Weekly source refresh (auto)"
            git push
          }

      - name: Fail the run if refresh, watchers or claim checks failed
        if: steps.refresh.outcome != 'success' || steps.watch.outcome != 'success' || steps.claims.outcome != 'success'
        run: |
          echo "refresh: ${{ steps.refresh.outcome }} · watch: ${{ steps.watch.outcome }} · claims: ${{ steps.claims.outcome }}"
          exit 1
