# Weekly Monitor source refresh — keeps the site's promise that sources are
# checked on a schedule, whether or not anyone is at a keyboard.
#
#   auto-apply : scripts/weekly_refresh.py  (Eurostat, SCB pulls + sanity gates)
#   watchers   : scripts/check_sources.py   (-> GitHub issue on a new release,
#                state in watch_state.json). Which sources are watched is listed
#                in that script's docstring and nowhere else: the copy that used
#                to live here had drifted to four of the six by 17 Aug 2026.
#
# Design: refresh and watch both run with continue-on-error so that one flaky
# API cannot block the other, the rebuild, or the commit of good results; the
# last step then turns the run red if anything failed, which makes GitHub
# email the maintainer. A failed sanity gate restores the data file from git,
# so a broken pull can never publish itself.
name: monitor-refresh
on:
  schedule:
    - cron: "17 5 * * 1"    # Mondays 05:17 UTC — before the European workday
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: monitor-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: build.py derives the DATA UPDATED stamp from git log on
          # the data files. A shallow clone has no history, so the stamp would fall
          # back to checkout mtime = "today" and churn docs/ every run.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # PyYAML is the only third-party import in the whole chain (weekly_refresh
      # and the five refresh_* scripts it shells out to). Pinned: an unpinned
      # install lets a new major silently take the Monday refresh down.
      - run: pip install "PyYAML~=6.0"

      - name: Auto-apply refresh (Eurostat, SCB)
        id: refresh
        continue-on-error: true
        run: python scripts/weekly_refresh.py

      - name: Watch the sources a machine must not auto-apply
        id: watch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_sources.py

      # Same step, and the same reason, as site-refresh.yml in the ai-monitor repo: build.py
      # typesets the two one-pager PDFs through LaTeX, and without tectonic it keeps
      # yesterday's sheets and carries on. That failure is invisible -- the site refreshes
      # while the downloadable sheet quietly stops moving -- so the two workflows that both
      # run build.py must both have it.
      - name: Install tectonic (the one-pager sheets are typeset, not templated)
        run: |
          curl -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv ./tectonic /usr/local/bin/tectonic
          tectonic --version

      - name: Rebuild site
        run: python build.py

      # After the rebuild, because it reads the BUILT page: that is what a reader sees and
      # what the Brief inherits. Before the commit, so a page that claims a counting unit it
      # is not computed on never reaches the live site.
      # Labels are the one thing a build cannot get wrong quietly: a clipped or crowded chart
      # is valid HTML and a clean build. See scripts/check_label_lengths.py.
      - name: Chart labels fit, and do not crowd the chart
        run: python3 scripts/check_label_lengths.py

      - name: Stored short labels match the rule
        run: python3 scripts/check_label_columns.py

      - name: Check every module states the unit it is computed on
        id: claims
        continue-on-error: true
        run: python scripts/check_claims.py

      # A module may lag a freeze; it may not claim one it has not been through.
      #
      # HALF of this check runs here and half cannot, and the script says which on every run.
      # Reading the definition a module was really built from, and asking git whether the
      # monitor inputs are committed, both need the ai-monitor checkout -- a PRIVATE repository,
      # which this public one must not hold a token for, the same rule check_upstream_alive.py
      # exists to work around. So those two run on a laptop and nowhere else, and CI checks the
      # modules that declare their vintage in the script itself. Until 24 Aug 2026 the script
      # instead exited 1 here before checking anything, because `from monitor_root import
      # MONITOR_ROOT` resolved the checkout at import and defeated the lazy __getattr__ written
      # to prevent exactly that; the run had been red on it every Monday since.
      - name: Every module names the definition it was really built from
        id: vintages
        continue-on-error: true
        run: python scripts/check_vintages.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" || {
            git commit -m "Weekly source refresh (auto)"
            git push
          }

      # The other half of the mutual watch, and AFTER the push on purpose. The upstream cannot
      # be read from here -- that would put a token for a private repository in a public one,
      # the direction site-refresh.yml refuses -- so this checks its EFFECT: has a data refresh
      # commit arrived recently. Credential-free, because this repository's commits are public.
      # Its mirror, scripts/check_schedules.py in the ai-monitor repo, watches this side.
      #
      # continue-on-error, and folded into the gate below: a silent upstream is worth an email
      # but has nothing to do with whether THIS refresh's own Eurostat and SCB data should
      # publish. A watchdog that blocks the publish it was watching over is a worse bug than
      # the one it detects.
      - name: The upstream refresh is still arriving
        id: upstream
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_upstream_alive.py

      - name: Fail the run if refresh, watchers or claim checks failed
        if: steps.refresh.outcome != 'success' || steps.watch.outcome != 'success' || steps.claims.outcome != 'success' || steps.upstream.outcome != 'success' || steps.vintages.outcome != 'success'
        run: |
          echo "refresh: ${{ steps.refresh.outcome }} · watch: ${{ steps.watch.outcome }} · claims: ${{ steps.claims.outcome }} · upstream: ${{ steps.upstream.outcome }} · vintages: ${{ steps.vintages.outcome }}"
          exit 1
