# 12-month theme calendar for the AIEL Monitor Brief (confirmed with Magnus 2026-07).
# Each month foregrounds one theme; over a year it covers the whole monitor.
# `theme` = which built chart+takeaway to show for now (exposure/demand/adoption/outcomes);
# months whose dedicated view isn't built yet map to the closest one until the 2-weeks-ahead
# monthly draft builds it out. `title` is the displayed monthly theme.
months:
  1:  {title_en: "Augmentation or automation?",              title_sv: "Förstärkning eller automatisering?",       theme: demand}
  2:  {title_en: "Which AI skills employers want",           title_sv: "AI-kompetenser i jobbannonserna",          theme: demand}
  3:  {title_en: "Canaries: young workers and entry-level",  title_sv: "Kanariefåglar: unga och instegsjobb",       theme: outcomes}
  4:  {title_en: "Different boats: gender and AI",           title_sv: "Olika båtar: kön och AI",                   theme: outcomes}
  5:  {title_en: "Who is adopting AI? Firms",                title_sv: "Vem använder AI? Företagen",                theme: adoption}
  6:  {title_en: "How professionals really use AI",          title_sv: "Hur yrkesverksamma använder AI",            theme: adoption}
  7:  {title_en: "AI exposure across Europe",                title_sv: "AI-exponering i Europa",                    theme: exposure}
  8:  {title_en: "Barriers: what firms say stops them",     title_sv: "Hinder: vad företagen anger stoppar dem",    theme: barriers}
  # Renamed 31 Aug 2026. The title said sectors, the only built chart was firm size, and the
  # draft brief then asserted that adoption depends more on size than on sector. It does not:
  # the industry spread is 12-88%, the size spread 14-72%. The sector cut is now built
  # (scripts/refresh_swe_adoption_sector.py), so the month carries both and names both.
  9:  {title_en: "Firm size and sector: who adopts?",      title_sv: "Storlek och bransch: vem använder AI?",     theme: adoption}
  # Retheme, 3 Sep 2026. October keeps reskilling as its subject but leads with the measurement
  # that qualifies it: the bare-AI band (advertisements that say AI and name no specific AI term)
  # has gone from a fifth of the floor in 2016 to 2.5x it in 2025, and 3.7x in the 2026 part-year.
  # Talk is growing much faster than demand for the skill, which is the first thing anyone
  # designing a reskilling response should know. `washing` gets its own chart and text rather
  # than reusing the `demand` slot, because months 1, 2 and 10 all sit on `demand` and would
  # otherwise print the same argument three times.
  10: {title_en: "AI talk and AI skills: the widening gap",  title_sv: "AI-prat och AI-kompetens: det växande gapet", theme: washing}
  11: {title_en: "Job quality and the work environment",     title_sv: "Jobbkvalitet och arbetsmiljö",              theme: outcomes}
  12: {title_en: "The year in review, and outlook",          title_sv: "Året i backspegeln",                        theme: exposure}
