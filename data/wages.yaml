# Wages by DAIOE generative-AI exposure tercile. Generated from
# lab-infrastructure/ai-monitor/data/wages/ (wages_build.py there refetches + rebuilds).
intro: >-
  Pay as an outcome: are wages in AI-exposed occupations pulling away, or falling behind?
  Occupations are split into thirds by their DAIOE generative-AI exposure; each line tracks
  the group's median wage, indexed to 100 in the first year. Nominal wages from public
  statistics; read the gap between lines, not the level.
headline: >-
  Over the past decade the most AI-exposed occupations have NOT pulled away in pay. In the
  United States they grew more slowly than the least exposed (40% against 49%, 2015 to
  2025), with a mild reversal after 2022; in Sweden the three groups moved almost in
  parallel. AI-exposed occupations remain the best paid in level terms in both countries.
