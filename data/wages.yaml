intro: 'Pay as an outcome: are wages in AI-exposed occupations pulling away, or falling behind? Occupations
  are split into thirds by their DAIOE generative-AI exposure; each line tracks the group''s median wage
  in REAL terms, indexed to 100 in the first year. Read the gap between lines, not the level.'
headline: 'Over the past decade the most AI-exposed occupations have NOT pulled away in pay. In the United
  States their real median wage grew 3.4 per cent against 8.5 per cent for the least exposed (2015 to
  2025), a gap of -5.1 percentage points the other way. In Sweden real wages are close to flat in all
  three groups over 2014 to 2025 (most exposed +0.8 per cent, middle +1.0, least -0.7). Read the post-2022
  turn with care: that window also covers the tightening cycle, which fell hardest on the same professional
  and technical occupations, so its timing does not identify a cause. AI-exposed occupations remain the
  best paid in level terms in both countries.'
