eu_line: >-
  EU27 (coarse, ISCO 1-digit, Structure of Earnings Survey): mean hourly earnings grew
  14.2 per cent in the most exposed third against 16.8 per cent in the least, 2018 to 2022.
  A finer country-level series is the planned upgrade.
caveats:
  - "Nominal wages; inflation affects all groups alike within a country, so the gap between lines is the signal."
  - "Exposure is DAIOE generative-AI (v2023), fixed over time: the lines answer how pay moved in occupations that are exposed today."
  - "Sweden is unweighted across occupations (the public table carries no employment counts); the US is employment-weighted."
  - "Descriptive, not causal: composition, sector and skill mix all move wages too."
