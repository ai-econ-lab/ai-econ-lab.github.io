intro: 'Everything above measures AI in the labour market; this small module tracks the technology itself,
  in the most work-relevant unit there is: how much human working time a single AI run can replace. The
  frontier is jagged, and it moves fast: on novel interactive worlds, where the goal must be inferred
  without instructions, the best system scored under 1% at the benchmark''s launch, 30% of human level
  in July 2026 and 63% in September, and 99.9% when the same September model is allowed the context management
  its own provider designed for it. That benchmark is scored against people by construction: every environment
  is verified solvable by a human, and 100% means matching human efficiency, so the figure is a distance
  to human performance rather than a head-to-head result. Frontier capability is also what our DAIOE exposure
  measure tracks on the technology side.'
