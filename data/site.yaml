# Site-wide config: brand, nav, links, footer. Edit here, run build.py, push.
brand:
  name: "AI-Econ Lab"
  monogram: "AIEL"
  tagline: "Örebro University · RATIO"
  domain: "ai-econlab.com"
  base_url: "https://ai-econlab.com"     # canonical host for <link rel=canonical> + sitemap
  description: >-
    An economics-led, multi-disciplinary research lab at Örebro University and RATIO,
    studying how artificial intelligence is reshaping the world of work.

# Top navigation. 'cta' renders as the filled button on the right.
# Revised 4 Aug 2026 (Schroeder review): "DAIOE" alone means nothing to a policymaker,
# journalist or student, so the nav spells out what it is and keeps the acronym. Events
# and News collapse to one entry, taking the top level from seven choices to six; both
# pages still exist and cross-link to each other.
nav:
  - {label: "Monitor",  href: "/monitor/"}
  - {label: "AI exposure (DAIOE)", href: "/daioe/"}
  - {label: "Research", href: "/research/"}
  - {label: "People",   href: "/people/"}
  - {label: "Events & news", href: "/events/"}
  - {label: "About",    href: "/about/"}

# Instrument registration strip under the masthead (honesty-as-aesthetic).
# Monthly brief subscription (Substack). Clean subscribe URL (no referral/tracking params).
brief_subscribe: "https://aielmonitor.substack.com/subscribe"

registration:
  - "SOURCES <b>JobTech</b> · Eurostat · AI Index · SCB · EU-LFS · Akavia"
  # 11.2M is the RECORD count. The page spends a whole module showing that counting
  # records rather than distinct advertisements manufactured a 30-point artefact, and
  # the published unit is the distinct advertisement (8.1M). A banner reading "11.2M
  # SWEDISH ADS" was the page's largest number and the one it tells you not to use.
  - "<b>8.1M</b> DISTINCT SWEDISH ADS · 36 COUNTRIES"
  # Derived at build time from the numeric data files' last git commit — see
  # data_updated() in build.py. Do not hand-type a date here; it will drift.
  # The weekly claim is backed by .github/workflows/monitor-refresh.yml (Mondays):
  # API sources auto-refresh behind sanity gates; report/release sources are watched
  # and open a GitHub issue. Remove the claim if that Action is ever disabled.
  - "DATA UPDATED <b>{data_updated}</b> · SOURCES CHECKED WEEKLY"
  - '<span class="lv">● LIVE · PUBLIC + PARTNER DATA</span>'
  - "MONITOR PROTOTYPE"

# Who supports the work. Added 4 Aug 2026.
#
# The Monitor claims editorial independence from funders while the site never said who the
# funders were, which is a weaker position than either statement alone: it invites the
# question "independent of whom?" and answers nothing. Disclosure first, independence
# after it, in that order.
#
# The categories are kept apart deliberately. Conflating hosts, grants and data
# partners is what produced the old "committed to no funder" line, which read as a
# contradiction one screen from a WASP-HS mention. Dated so a stale list is visibly
# stale rather than quietly wrong.
support:
  asof: "August 2026"
  groups:
    - kind: "Host institutions"
      note: "Premises, infrastructure and the research environment. Ratio has also contributed financially to the underlying research."
      items:
        - "Örebro University"
        - "Ratio Institute"
    # Names and grant numbers only, matching the acknowledgement footnote of the DAIOE
    # paper, which is published and therefore canonical. Deliberately NOT saying what each
    # grant paid for: a funding disclosure exists so a reader can judge whether money could
    # have shaped findings, and it does that from the funder's identity alone. Describing
    # the work each grant covers discloses the research pipeline to anyone reading, which
    # is a different thing and not ours to give away (Magnus, 4 Aug).
    # If a grant appears in a published acknowledgement and not here, here is wrong.
    #
    # THE TEST is the one in this group's note: did the grant fund the research THIS PAGE
    # describes? Not whether it is project-specific. Every grant listed is project-specific;
    # that is what research grants are.
    #
    # P26-0234 was briefly excluded here on the grounds that it funds the MYH/YH line. That
    # was wrong: the YH work sits inside the same project and runs on the same register
    # database as the DAIOE work (Magnus, 4 Aug), so it passes the test and is listed.
    #
    # NOT LISTED, and not an oversight: applications still under decision. The VR open call
    # for the YH-RCT was submitted 10 Feb 2026 with a decision due around Nov 2026. A
    # disclosure lists money received; a pending application shown as funding reads as
    # support that does not exist. Add it if and when it is granted.
    # Co-authors' own funding is NOT enumerated here, on purpose. Much of the multi-country
    # work is funded per author at the author's own institution: on the Danish adoption
    # paper alone, PIREAU and the ROCKWOOL Foundation Berlin support Pulito and a Czech
    # EU-cofunded project supports Pytlikova. Listing those here would go stale with every
    # new co-author, would duplicate and eventually contradict the papers' own
    # acknowledgements, which are the published and authoritative record, and would risk
    # implying their funders paid the lab. One sentence pointing at the papers is both
    # honester and more complete than any list this page could keep current.
    - kind: "Research funding"
      note: "Grants supporting the research the Monitor and DAIOE are built from. Collaborators at other institutions are supported by their own funders, named per author in each paper's acknowledgements."
      items:
        - "Jan Wallander and Tom Hedelius Foundation (P19-0234 and P26-0234), a Handelsbanken research foundation."
        - "Torsten Söderberg Foundation (E46/21, ET3/23)."
        - "WASP-HS (grant 805), through the Örebro University node of the AISCAF research cluster. The lab contributes to AISCAF rather than being part of it."
    # Deliberately not year-by-year. Handelsbanken's foundations have funded several
    # editions but not all, so naming one year both understates the relationship and
    # needs editing every August. "Several editions, most recently" is accurate under
    # either reading and does not go stale.
    - kind: "Conference and events"
      note: "The annual AIEL conference on AI and white-collar work is funded separately from the research."
      items:
        - "Jan Wallander and Tom Hedelius Foundation and Tore Browaldh Foundation, the Handelsbanken research foundations, have funded several editions of the conference, most recently 2026 (Fh25-0082)."
  statement: >-
    The AIEL Monitor has no dedicated funder. It is built as part of the lab's research
    infrastructure, on public data. No funder or data partner controls its methods, its results
    or the timing of publication. Organisations that share data with us, who are not funders,
    are listed separately below.

# Organisations that share data with the lab. Credit, not funding: none of these
# fund the lab, and listing them implies no endorsement of our results.
data_partners:
  - name: "Akavia"
    url: "https://www.akavia.se/politik-paverkan/sakomraden/ai-digitalisering/"
    what: "Member web panel on AI and working life, 2023 onwards. Shared with the lab; we publish aggregates with attribution."

