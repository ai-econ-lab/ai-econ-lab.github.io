# Funding is disclosed in one place, on the About page, so the list cannot drift between
# pages. This page links there rather than restating it.
funding_href: "/about/#support"

benchmark_logic: >-
  Lightcast, which also powers the Stanford AI Index, extracts hand-selected AI skills from the whole
  posting text with no role scoping, and counts generic "artificial intelligence" as a skill in itself. It
  therefore corresponds to our broad, whole-text ceiling and not to our role-scoped floor: our floor sits
  deliberately below Lightcast, and comparability is established at the ceiling. Because the Lightcast
  series is rising fast, any comparison must be period-matched, and because its AI-occupation band captures
  only a small fraction of skill-level AI demand, our comparisons target its stacked skill total rather than
  the occupation band.

