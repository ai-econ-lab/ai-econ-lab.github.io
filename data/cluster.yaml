# The AISCAF cluster on the Monitor and in the brief (ML, 14 Oct 2026).
#
# Two rules govern everything in this file.
# 1. CREDIT IS ASYMMETRIC. The lab's own items stay AIEL-branded. Every item from others in the
#    cluster carries FULL credit (authors, institution, the publication and its date) and links
#    to the producer's own page, with the Monitor only as the access point. Oskar Nordström
#    Skans agreed on 12 Oct 2026 (AISCAF CLT, Uppsala) that the Monitor may spread the
#    Tillväxtanalys results now and henceforth on exactly that condition.
# 2. THE AI SWEDEN FUNCTION IS NOT MENTIONED until the consortium is signed.
# Never write "realtid"/"real-time" in our own prose (a published title is quoted as published).
#
# English pages use the working paper's English title and Tillväxtanalys's English name, Growth
# Analysis; the Swedish report (Rapport 2026:17) is linked, not titled (ML, 14 Oct 2026).

intro: >-
  The Monitor is one of the AI-Econ Lab's contributions to AISCAF, a research cluster on AI,
  structural change and the future of work, financed by WASP-HS, with nodes in Uppsala, Stockholm
  and Örebro. Other researchers in the cluster
  follow the same questions with other data. We point to their results here, so that readers find
  the cluster's monitoring in one place.

items:
  # English working-paper title, Growth Analysis by its English name, the Swedish report as a
  # link only, and no sentence on how their work relates to ours (ML, 14 Oct 2026).
  - kicker: "Uppsala University · September 2026"
    title: "Structural Change and AI-Exposed Skills: Evidence from Swedish Real-Time Administrative Data"
    text: >-
      Oskar Nordström Skans and Leo Sokolow Romin (Uppsala University, AISCAF), in a project with
      the Swedish Agency for Growth Policy Analysis (Growth Analysis). They find no clear sign yet of
      a broad AI-driven structural change in the economy as a whole, but outcomes for new graduates
      from fields where AI is judged especially relevant have deteriorated since 2023.
    cite: >-
      Nordström Skans, O. and Sokolow Romin, L. (2026). Structural Change and AI-Exposed Skills:
      Evidence from Swedish Real-Time Administrative Data. Working paper, Uppsala University,
      version 29 September 2026. https://drive.google.com/file/d/1DHVJWQgO4xaA3dSi0yJ3Yi7308kigHNU/view.
      Swedish report: Growth Analysis, Rapport 2026:17.
    links:
      # Public link from ML, 14 Oct 2026 (the authors' Drive copy, version 29 Sep 2026).
      - {label: "Working paper (PDF)", href: "https://drive.google.com/file/d/1DHVJWQgO4xaA3dSi0yJ3Yi7308kigHNU/view"}
      - {label: "Summary in English (WASP-HS)", href: "https://wasp-hs.org/how-ai-affects-the-swedish-economy-and-labour-market/"}
      - {label: "Report in Swedish (Growth Analysis)", href: "https://www.tillvaxtanalys.se/publikationer/rapport/rapportserien/strukturomvandligenochai.129145.html"}
  - kicker: "Seminars · AI-Econ Lab, part of AISCAF"
    title: "The AI-Econ Lab brown-bag seminar series"
    text: >-
      The lab's online seminar series has been part of AISCAF since autumn 2025: research on AI
      and work, presented by its authors, open to all.
    links:
      - {label: "Seminars and events", href: "/events/"}
  - kicker: "AISCAF"
    title: "The whole cluster"
    text: >-
      Researchers, publications and media from all three nodes.
    links:
      - {label: "AISCAF publications", href: "https://www.aiscaf.se/w/ac/publications"}
      - {label: "People at AISCAF", href: "https://www.aiscaf.se/w/ac/people-at-aiscaf"}

# The brief. Every issue carries the standing line, so readers always see that the lab both
# contributes to the cluster and is funded through it (ML, 14 Oct 2026: "the briefs henceforth
# clearly signal that we also contribute / benefit from the cluster"). An issue may add one
# cluster item, credited in full, keyed "YYYY-MM"; most months will have none.
brief:
  standing:
    # One printed line in the brief footer (mono, beside the marks), so keep it under ~70 characters.
    en: "The lab contributes to AISCAF (WASP-HS), which funds part of the lab."
    sv: "Labbet bidrar till AISCAF (WASP-HS), som finansierar delar av labbet."
  issues:
    "2026-10":
      en: >-
        Nordström Skans and Sokolow Romin (Uppsala University) find, in their first report with
        Growth Analysis (<a href="https://www.tillvaxtanalys.se/publikationer/rapport/rapportserien/strukturomvandligenochai.129145.html">Rapport 2026:17</a>, in Swedish), worse outcomes since 2023
        for new graduates in fields where AI is especially relevant.
      sv: >-
        Nordström Skans och Sokolow Romin (Uppsala universitet) finner i sin första rapport med
        Tillväxtanalys (<a href="https://www.tillvaxtanalys.se/publikationer/rapport/rapportserien/strukturomvandligenochai.129145.html">Rapport 2026:17</a>) sämre utfall sedan 2023 för
        nyutexaminerade inom AI-relevanta utbildningar.
