# AI in Demand — monitor content. Numbers are REAL (from the prototype).
# The builder/integrator/user split is a PREVIEW (not yet measured) — keep it flagged.

headline: "The AIEL Monitor"
# Rewritten 4 Aug 2026 after Sarah Schroeder's pre-launch review. Three defects in the
# previous version: it was one dense block on arrival; it announced "four questions" and
# the overview below then showed five cards; and "committed to no funder" sat one screen
# from a page that reports WASP-HS funding, which reads as a contradiction rather than as
# the independence claim it is meant to be. Capability is now placed as context the other
# four are read against. It was briefly worded as "the shock driving the four", which
# asserts a causal mechanism the Monitor does not measure, on a page whose exposure module
# insists that exposure is not displacement (Magnus, 4 Aug). Keep this descriptive.
# Rewritten 12 Aug 2026. The opening sentence said the Monitor "tracks how artificial
# intelligence IS CHANGING work", which presupposes the causation the one-pager's standfirst
# spends a paragraph denying it can show, and it is the same defect the note above records
# catching on 4 Aug in a different sentence. "In unusual depth" was a claim about us. The
# wording now mirrors the sheet's own subtitle, so the two say the same thing in the same words.
lede: >-
  The AIEL Monitor reports the evidence on artificial intelligence and work, internationally and
  for Sweden in depth. It is organised around four questions: which jobs are exposed, what
  employers demand, which firms adopt AI, and how employment and job quality are changing. A fifth
  module tracks the pace of the technology itself, which the other four are read against. Every indicator
  is dated and sourced, and built on public data so it can be cited and refreshed automatically.

# Overview-first landing: one door per spine module (Exposure · Demand · Adoption · Outcomes).
# International-first headline number each; Sweden is the depth cut inside the module. Every figure dated.
overview:
  - {k: "Exposure", num: "30<span>%</span>", lab: "of European jobs are in the top-25% most AI-exposed occupations (by generative-AI exposure); Sweden 39%, among the highest of 36 countries.", foot: "DAIOE genAI v2023 · EU-LFS", anchor: "#exposure", cls: ""}
  - {k: "Demand",   num: "1.9<span>%</span>", lab: "median share of job ads requiring AI across 22 countries in 2025 (Stanford AI Index); Sweden 2.8%.", foot: "AI Index / Lightcast · 2025", anchor: "#demand", cls: "b"}
  - {k: "Adoption", num: "20<span>%</span>", lab: "of EU firms used AI in 2025, up from 8% in 2023 (Eurostat); Sweden 35%, among the leaders.", foot: "Eurostat · 2025", anchor: "#adoption", cls: "c"}
  # Swapped 1 Aug 2026 (Magnus). This card carried the entry-level squeeze, which is the
  # page's most attackable number: the only module on a different instrument, the only one
  # still counting ad records, and the first thing a competitor goes for. It also left the
  # grid with five cards that were all league placings or alarming trends, so a reader who
  # reads only the cards took away the opposite of what the page's evidence supports. The
  # wages result is the least attackable finding on the page and is deflationary. The
  # squeeze keeps its module, where its caveats live.
  # Restated in REAL terms 1 Aug 2026. The nominal version of this card read −9pp on
  # "40% against 49%". Deflation leaves the pay RATIO between groups unchanged but does change
  # a DIFFERENCE OF GROWTH RATES, which is what this card reports, so the honest figure is
  # −6.6pp. It also makes the claim harder to wave away: real wages flat in every Swedish
  # exposure group over eleven years is a starker null than "+34% nominal".
  - {k: "Outcomes", num: "−6.6<span>pp</span>", lab: "slower REAL wage growth in the most AI-exposed US occupations than in the least exposed, 2015–2025 (3.6% against 10.2%); in Sweden real wages are flat in all three exposure groups. No pay premium for exposure in either country.", foot: "SCB · BLS OEWS × DAIOE genAI · real terms · SE 2014–2025, US 2015–2025", anchor: "#wages", cls: "d"}
  # role: driver (4 Aug 2026). Capability is not a fifth question about the labour market:
  # it measures the technology rather than the market, which is why it sits apart. Rendering
  # it as a fifth peer card is what produced the "four questions, five cards" contradiction
  # Schroeder caught. stat_overview() pulls any entry marked driver out of the card grid and
  # renders it as a full-width band beneath. The key name is historical; the label shown to
  # readers is deliberately not causal.
  - {k: "Capability", num: "12–17<span>h</span>", lab: "the longest human-expert tasks frontier AI agents can finish about half the time; that length has been doubling every 4–6 months.", foot: "METR · May 2026", anchor: "#capability", cls: "e", role: "driver"}


# The AI in Demand module.
aiindemand_lede: >-
  How often Swedish employers ask for AI skills in their job ads, by year, by occupation, and
  soon by whether they want AI built, integrated, or simply used. We name the series by what
  the employer does, never by what the job is: ads that ask for AI skills, ads that name an
  AI skill. We deliberately avoid the phrase "AI jobs".

# Plain-language captions (Harford test). Use verbatim beneath every figure of each series.
captions:
  floor: >-
    The share of ads on the Swedish public job board that ask the person being hired to work
    with AI, naming a specific skill such as machine learning in the job's own requirements.
  specific: >-
    The share of ads on the Swedish public job board that mention a specific AI skill, such as
    machine learning, anywhere in the ad.
  # Reworded 5 Aug 2026. This caption sits under a chart carrying BOTH lines, and it was true
  # of only one of them: the lower line excludes company-only mentions, the upper line counts
  # them wherever they appear. Stating it of both made the upper line look stricter than it is.
  # Added 10 Aug 2026 after Moa Tivell read the page and came away thinking this module
  # measures EMPLOYMENT by occupation, and that it could not see competence requirements.
  # Both halves are the wrong way round, and the page invited it: the top lede offers "what
  # employers demand" and "how employment and job quality are changing" as two of four
  # questions, and this module never said which one it is. Her second point, that a reader
  # needs help not to over-read causality, is answered in the same paragraph.
  scope: >-
    What this measures, and what it does not. This is demand written down in advertisements:
    whether the employer asks the person being hired to know or do AI, in the role's own
    requirements. It is not employment, which the outcomes module reports separately, and it is
    not AI use inside firms, which the adoption module reports. A rising line means employers
    ask for AI skills more often than they did; on its own it says nothing about whether AI
    created or removed any job. Not all hiring is advertised, so this is the advertised margin
    of demand rather than demand itself.
  guard: >-
    The two lines differ in where we read. The lower line counts an ad only when AI is named in
    the job's own requirements, so ads that mention AI while describing the company are left
    out; the upper line counts a named AI skill anywhere in the ad, company description
    included. The gap between them is the reason we publish a range rather than a number.
  floor_sv: >-
    Andelen annonser på Platsbanken som ber den som anställs att arbeta med AI, med en namngiven
    färdighet som maskininlärning bland tjänstens egna krav.
  specific_sv: >-
    Andelen annonser på Platsbanken som nämner en specifik AI-färdighet, som maskininlärning,
    någonstans i annonsen.

# The trend moved OUT of this file on 25 August 2026. It is generated into data/trend.yaml
# by scripts/refresh_trend.py, which reads the bulk series and records the definition it was
# built from. It lived here as two hand-typed arrays while build.py stamped them with the
# site's current DEF_VERSION, so the label followed each freeze and the numbers did not: at
# v1.5 the site published the v1.4 series under a 'frozen v1.5' stamp for six days, and a 38x
# tile sat above a 32x chart. Do not reintroduce the arrays here.

# Tile convention settled 12 Aug 2026 (Lydia's review): the grey foot line is always
# source · vintage, never description; anything descriptive belongs in the label, which
# ends with a full stop.
tiles:
  - {num: "1.06<span>%</span>", lab: "of 2025 job advertisements name a specific AI skill; 0.55% ask for it in the job's own requirements.", foot: "Platsbanken · frozen v1.5 · distinct ads · 2025", cls: ""}
  - {num: "38×", lab: "rise in ads naming an AI skill, from a pooled 2006–08 base to 2025 (0.028% → 1.06%, 95% interval 33–44×); the strict floor rose 42×. Measured instead from a 2015–17 base, where the term list has been stable across freezes, the rise is 6.3× (6.0–6.4).", foot: "Platsbanken · base 2006–08 (675,259 ads, 190 flagged) · 2025", cls: "b"}
  - {num: "29.4", lab: "ads per 10,000 named a generative-AI skill in 2025, from near zero before 2023; 28% of AI demand.", foot: "Platsbanken · 2025", cls: "c"}
  - {num: "−5.3<span>pp</span>", lab: "fewer entry-level openings in the most AI-exposed occupations, a gap widening since 2020; descriptive, and not separable from the rate cycle.", foot: "JobTech · 2020–2025", cls: "d"}

# The live 60-day window: its own instrument, never a point on the archive line (no-splice).
livewindow:
  # Refreshed 12 Aug 2026 from ai-monitor/data/jobstream/livewindow.json, emitted by
  # `jobstream_ingest.py --emit-livewindow`. It had been hand-copied and sat at 24 Jul for a
  # fortnight, publishing 1.85 and 0.89 while the feed said 1.64 and 0.81.
  #
  # The window was ALSO spliced when those figures were written: rows are scored once at
  # ingest and never re-scored, so the 60-day window had 71% of rows on the v1 definition and
  # 29% on v1.1, averaged into one number with nothing saying so. It has since been re-seeded
  # and is 100.0% on v1.3, matching the archive series for the first time since v1.1.
  # FALLBACK ONLY, and the last figures placed here by hand (12 Aug 2026). The live source is
  # data/livewindow.yaml, written by scripts/refresh_livewindow.py from the JobStream store;
  # build.py loads this block first and lets that file override it. These four keys stay so the
  # page still renders, with an honest date, if the generated file is missing.
  #
  # The prose that used to sit here as `sentence:` is gone. It carried "32,022", "1.57" and
  # "0.80" as typed characters next to the same four numbers as data, so the two could and did
  # disagree, and any refresh that moved `asof` alone would have advanced the date over three
  # frozen figures. build.py composes that sentence from the numbers now; `note` below is the
  # part that is genuinely prose and makes no numeric claim.
  asof: "12 Aug 2026"
  asof_iso: 2026-08-12
  window_days: 60
  n: 32022
  names_pct: 1.568
  floor_pct: 0.799
  names_ci: [1.437, 1.71]
  floor_ci: [0.708, 0.903]
  note: >-
    These numbers run a little higher than the chart's, for two reasons we have measured: the
    live feed carries a somewhat different mix of ads than the yearly archives, and the archives
    store slightly shortened ad texts. Once we can calibrate the two against each other, they
    will join into one line that runs to today. A rolling window also moves with the season, so
    compare it with the same weeks a year earlier rather than with last month; August is the low
    point in every year we can measure (0.64% in 2023, 0.84% in 2024 and 0.90% in 2025 on the
    whole-text measure), and September recovers each time.

# Top ADVERTISEMENT TITLES (verbatim, from the candidate extracts: floor_top_titles.csv),
# plus taxonomy-level churn. Free-text neologism newcomers: next release.
titles:
# Renamed 12 Aug 2026: "Ad titles · verbatim" read as a leftover "add title" placeholder
# (Lydia's review).
  flag: "employers' own wording"
  intro: >-
    Where the demand sits, in the employers' own words. The same titles head the list year
    after year: machine learning engineer, data scientist, AI/ML developer. One entry is a
    measurement artefact worth naming: medical secretary (medicinsk sekreterare) appears because those ads
    mention speech-recognition software, and our classifier judges almost all of them to be
    describing a tool the job uses rather than an AI skill it asks for. The newcomers column
    is the language at work: job titles crossing three ads in a year for the first time.
  top:
    - {year: "2026 · H1", items: ["Machine learning engineer", "Data scientist"]}
    - {year: 2025, items: ["AI/ML-utvecklare (AI/ML developer)", "Machine learning engineer"]}
    - {year: 2024, items: ["Machine learning engineer", "Data scientist"]}
  newcomers:
    label: "New titles in AI demand"
    items: ["AI ambassador (2023)", "AI content producer (2023)", "AI-experter / AI experts (2024)", "AI lead (2025)", "AI data annotation specialist (2025)", "Senior agentic AI developer (2026)"]
  cooled:
    label: "Cooled: no longer clear the bar"
    items: ["Telemarketer (2018)", "Construction engineer (2022)", "Mathematical statistician (2023)", "Inside sales (2024)", "Network technician (2024)"]
  caveat: >-
    Top titles and the newcomer list are the advertisements' own headlines, as employers
    wrote them (lightly cleaned: employer and place names removed), with an English gloss
    where the employer wrote in Swedish; top titles are counted
    among ads that ask for AI skills in the role itself, and a newcomer's year is the first
    in which at least three ads carry that title. The cooled list still uses the employment
    service's occupation taxonomy (our English renderings), where an occupation "clears the
    bar" with at least five AI-skill ads in a year. A vacancy posted more than once counts
    each time.

segmentation:
  flag: "First release · measured to Jun 2026"
  intro: >-
    Every ad that asks for AI skills in the role itself, 2023 to mid-2026, classified by
    what the worker is hired to do with AI. A language-model classifier applies the lab's
    written labelling rules; it agrees with our hand-labelled reference ads 88 per cent of
    the time on the four-way split and 91 per cent on the grouping shown here. The
    headline: employers still mostly hire people to build AI, but the fastest-growing tier
    is people hired to simply use it.
  cards:
    - {name: "Builders",    color: "--c1", text: "Create AI: ML engineers, data scientists, applied-ML research. Half of strict AI-skill ads and steady: 46% in 2023, 51% in the first half of 2026."}
    - {name: "Integrators", color: "--c2", text: "Wire AI in and shape its adoption: architects, MLOps, adoption champions. Growing: 17% in 2023, 23% in the first half of 2026."}
    - {name: "Users",       color: "--c3", text: "Use AI as a tool of an otherwise non-AI job: admin, marketing, care, teaching. Small but rising fastest: 1% in 2023, 9% in the first half of 2026, and climbing quarter on quarter."}

caveats:
  - "<b>2026 is partial</b>: the first half comes from the Q1–Q2 archives and the latest weeks from the live feed; the newest point will revise."
  - "The chart ends with the June archives; the live feed runs to today and joins the chart once the two sources are reconciled."
  - "<b>The 2022–2023 dip is mostly an artefact of reposting.</b> Repeat postings ran 33% of records in 2021 and 49% in 2023, and AI ads repeat at about half that rate, so the denominator swelled faster than the numerator exactly when the dip appears. Counting each advertisement once, the share drifts 7% from 2021 to 2023 against the 30% fall the raw series shows. A real slowdown remains; a collapse does not."
  - "<b>The upper bound is now measured across the whole series, not just 2025.</b> Counting every ad that mentions AI in any form gives 2.45% for 2025, but that band is mostly company boilerplate. We read 230 advertisements from it by hand, spread over four periods — 2006–2013, 2019, 2022 and 2025 — and 32 are genuinely AI roles. The four periods are statistically indistinguishable, so a single correction applies throughout rather than a different one per year. Re-derived on the v1.4 band it is <b>12.8% (95% interval 8.9–18.1)</b>, and v1.5 leaves the bare-AI band unchanged to the advertisement, so that derivation carries over, which puts the corrected 2025 ceiling at <b>1.25% (1.19–1.32)</b>, not 2.45%, and the published 2025 range at <b>0.55% (floor) to 1.25% (ceiling)</b>."
  - "<b>The ceiling bounds AI demand we can detect from words, not AI demand.</b> Both lines are anchored to a term list, so an ad that is genuinely an AI job and never uses an AI word is in neither, and nothing on this page bounds it. That residual is not yet measured; an audit of the ads the term list never flags is the next piece of work. Its direction is known and it is upward."
  - "Ads that mention AI only when describing the company never count <i>towards the floor</i>; the floor counts an ad for what it asks of the person being hired. The broader line does count them, which is precisely why the two differ."
  - "Counts are <b>distinct advertisements</b>: employers repost, so the archive holds {records_m} million records but {distinct_m} million distinct advertisements, and each is counted once. The raw-record series is retained alongside as the robustness line. Two modules still count records and say so where they appear: the entry-level squeeze, which reads totals from an API that cannot be deduplicated, and the employers' own wording block, where a vacancy posted more than once counts each time."
  - "The builder / integrator / user split is classifier-based (validated against hand-labelled ads at 88% on the four-way split); a small share of ads sits in an AI-literacy grey zone outside the three tiers, and a reconciliation of the classifier's strictness against our hand-labelled benchmark is in progress. Shares may move a little; the ranking and trends are robust."

# Module 5 (minor): AI capability — external series, summarised quarterly.
# Verified 25 Jul 2026; sources + method in ai-monitor/notes/ai-performance-module_2026-07-25.md.
capability:
  flag: "External series · refreshed quarterly"
  intro: >-
    Everything above measures AI in the labour market; this small module tracks the
    technology itself, in the most work-relevant unit there is: how much human working
    time a single AI run can replace. The frontier is jagged, and it moves fast: on novel
    interactive worlds, where the goal must be inferred without instructions, the best
    system scored under 1% at the benchmark's launch, 30% of human level in July 2026 and
    63% in September, and 99.9% when the same September model is allowed the context
    management its own provider designed for it.
    That benchmark is scored against people by construction: every environment is verified
    solvable by a human, and 100% means matching human efficiency, so the figure is a
    distance to human performance rather than a head-to-head result. Frontier capability is
    also what our DAIOE exposure measure tracks on the technology side.
  # When a watched source was last confirmed unchanged. Not the same fact as the
  # figure's own as-of date in its footnote: METR's page moved on 3 Aug 2026 while
  # its figures did not. Clears the watcher's change note; see refresh_capability.py.
  # Re-read 10 Aug 2026 after the weekly gate flagged both source pages as changed.
  # METR: page still says "Time Horizon 1.1 (Current)" and "Measurements above 16 hrs are
  #   unreliable with our current task suite", and its own LAST UPDATED is 8 May 2026, which
  #   predates the previous review, so the data vintage has not moved. Figures unchanged.
  # ARC: the leaderboard is canvas-rendered and unreadable by fetch, so it was read in the
  #   browser. ARC-AGI-3 best frontier system sits at 30 per cent (Claude Opus 5 High), the
  #   next best near 10, against the benchmark's own definition that 100 per cent means
  #   matching human efficiency. Unchanged.
  # Re-read 12 Aug 2026: ARC cleared on the 10 Aug stamp and stayed clear, METR tripped again.
  # METR: figures unchanged again, and this time on machine-readable evidence rather than
  #   prose. The page's LAST UPDATED still reads 8 May 2026, it still says "Time Horizon 1.1
  #   (Current)" and carries the 16 h caveat; and the v1.1 suite identifiers inside its own
  #   thData blob — long_tasks_version 799cc9c4b4483a93fc3445623a49ea1bd74fdeb2, swaa_version
  #   f6cc84052e2a79dd540766c8a1b15ff399696371 — are byte-identical across every fetch,
  #   including one whose whole-page hash differed. The page hash moves; the data does not.
  # Those two identifiers are now what the watcher actually compares, so a METR trip from
  # here on means the measurements moved rather than the CDN: see metr_identity() in
  # scripts/refresh_capability.py. ARC still goes by page hash because it publishes no
  # anchor, so its figure is still read in a browser when the page moves.
  # Re-read 17 Aug 2026, after the weekly gate failed on ARC on both 10 and 17 Aug.
  # ARC: unchanged. Read in the browser again, and this time out of the leaderboard's own
  #   DOM table rather than off the plot: ARC-AGI-3 is topped by Claude Opus 5 (High) at
  #   30.2 per cent, dated 2026-07-24, with GPT-5.6 Sol (Max) second at 7.8. So "100% vs 30%"
  #   stands, and the second-place figure the 10 Aug note put "near 10" is 7.8.
  #   What moved the page was an unrelated addition: xAI's Grok 4.6 family was published on
  #   2026-08-11, and its XHigh tier scores 2.1 on ARC-AGI-3. The watcher cannot tell that
  #   from a headline change, and it should not try -- a leaderboard addition is exactly when
  #   a top score might move, so the trip was correct and the re-read is the price.
  #   Checked while re-reading, and worth recording so nobody re-tries it: the scores are NOT
  #   fetchable. arcprize.org/leaderboard ships no <table> in its HTML (curl gets 45 kB with
  #   no "Opus 5" anywhere); the table is built client-side. arcprize.org/arc-agi/3 IS
  #   server-rendered but carries only the definition, "A 100% score means AI agents can beat
  #   every game as efficiently as humans", and no score at all. Watching that page instead
  #   would look machine-readable while being blind to the number, which is the precise
  #   failure that let ARC-AGI-3 run from under 1% to 30% unnoticed for four months.
  # Re-read 18 Aug 2026 in the browser. The 30% is unchanged and still Claude Opus 5 (High)
  #   at 30.2, dated 2026-07-24. The 100% was WRONGLY FRAMED and is now fixed. The
  #   leaderboard's own Human Panel row reads 98.0 on ARC-AGI-1, 100.0 on ARC-AGI-2 and
  #   N/A on ARC-AGI-3: ARC publishes no measured human panel for v3 at all. The 100% is
  #   the definition of the scale, not a result — "A 100% score means AI agents can beat
  #   every game as efficiently as humans", with every environment verified human-solvable.
  #   So "100% vs 30%" read as a head-to-head between people and machines, which it is not.
  #   Note that the 17 Aug entry above QUOTES that definition sentence and still concludes
  #   the pairing stands; having the evidence in the note was not enough, because nobody
  #   asked what the 100% was a measurement OF. The card now states a distance to human
  #   performance and names the system holding the score.
  # Re-read 24 Aug 2026 in the browser, after the weekly gate failed on ARC on 17 and 24 Aug.
  #   Unchanged, and unchanged in all three of the things this card rests on: ARC-AGI-3 is
  #   still topped by Claude Opus 5 (High) at 30.2, still dated 2026-07-24; GPT-5.6 Sol (Max)
  #   is still second at 7.8; and the Human Panel row still reads 98.0 / 100.0 / N/A, so ARC
  #   still publishes no measured human panel for v3 and the "distance to human performance"
  #   framing set on 18 Aug still holds.
  #   What moved the page was again an addition that cannot touch the figure: Gemini 3.7 Flash
  #   (High, Medium, Low) and DeepSeek V4 Pro 0813, all published 2026-08-13, all N/A on
  #   ARC-AGI-3. That is the third trip in a row caused by a new row rather than a new top
  #   score. The watcher is right to trip anyway -- a leaderboard addition is exactly when a
  #   top score might move -- but it is worth noticing that the page hash has now cost four
  #   re-reads and found no change in any of them, and that ARC publishes no anchor that would
  #   let it do better. If a fourth follows, the thing to build is a DOM read of the one cell
  #   (top ARC-AGI-3 score and its date) rather than a hash of the whole page.
  # Re-read 4 Sep 2026, prompted by Magnus rather than by the gate: the weekly watcher runs
  #   Mondays and last ran 31 Aug, so the 2 Sep publication had not yet been seen. THIS TIME
  #   THE FIGURE MOVED, and by more than the card's whole previous range. ARC Prize published
  #   verified results for OpenAI's GPT-6 Astra on 2026-09-02
  #   (arcprize.org/results/openai-gpt-6-astra, blog at arcprize.org/blog/astra):
  #     Standard harness        62.7% at max reasoning, $26,098, ARC-AGI-3 Semi-Private
  #     Provider Adapter        99.9% at high reasoning, $18,817
  #   Both are ARC Prize Verified and both go on the leaderboard from here, each labelled.
  #   The card takes the Standard harness figure, because that is the only one comparable to
  #   the 30.2% it replaces: ARC's own words are that the Standard harness "gives us a
  #   consistent, apples-to-apples comparison across providers", while the Provider Adapter
  #   "preserves opaque reasoning state between requests and uses compaction", which is the
  #   provider's own machinery and not a shared interface. So the like-for-like reading is
  #   30.2% in July to 62.7% in September, six weeks apart, and the 99.9% is named in the
  #   card's body rather than as its number.
  #   Do NOT confuse either with PRO-LONG, a third red-teaming harness with a code sandbox.
  #   That is the one ARC caveats as "the combined performance of the model and its tools",
  #   and it is not what the 99.9% was scored under.
  #   The 18 Aug framing survives and is now doing real work: 100% remains the definition of
  #   the scale rather than a measured human panel, so 99.9% means "at the benchmark's own
  #   definition of human efficiency", not "beat a tested group of people". ARC states both
  #   that "Humans can solve 100% of the environments" and that Astra "used fewer actions than
  #   the human baseline on 96.0% of levels", the second against a median of ~500 tested
  #   members of the public. ARC also writes, in the same post, that it is "not claiming that
  #   it is AGI" and that ARC-AGI-3 "does not represent the complexity and open-endedness of
  #   the real world". Both belong in any talk that quotes this card.
  #   On the watcher: the 24 Aug note said that if a fourth hash trip found nothing, the fix
  #   was to read the one cell instead of hashing the page. The fourth trip is this one and it
  #   found the largest move the card has ever carried, so the hash earned its keep. The real
  #   defect is latency, not precision: a Monday-only watcher on a source that publishes on a
  #   Wednesday leaves the site up to six days wrong, and this time the number was wrong by a
  #   factor of two. A DOM read of the top ARC-AGI-3 cell, run daily, would fix both.
  reviewed: {metr: 2026-08-12, arc: 2026-09-04}
  facts:
    - {num: "12–17 h", lab: "Longest tasks frontier AI agents finish about half the time, in human-expert time.", foot: "METR Time Horizon 1.1 · above 16 h unreliable on this task suite · May 2026"}
    - {num: "×2 every ~4 mo", lab: "How quickly that task length has been doubling, on the trend since 2023 (95% CI 3.4–5.2 months).", foot: "METR Time Horizon 1.1 · doubling time · May 2026"}
    - {num: "5× per year", lab: "Growth of computing power used to train frontier models, since 2020.", foot: "Epoch AI · Feb 2026"}
