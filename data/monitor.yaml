# AI in Demand — monitor content. Numbers are REAL (from the prototype).
# The builder/integrator/user split is a PREVIEW (not yet measured) — keep it flagged.

headline: "The AIEL Monitor"
lede: >-
  How artificial intelligence is reshaping work: measured internationally through a portable exposure
  measure (DAIOE) and public data, and in unusual depth for Sweden via job ads, firm surveys and
  administrative registers. One spine of four questions: how exposed the work is, how much employers
  demand AI, how far firms have adopted it, and what it means for jobs. Built on public data so every
  figure can be cited and refreshed automatically, and committed to no funder.

# Overview-first landing: one door per spine module (Exposure · Demand · Adoption · Outcomes).
# International-first headline number each; Sweden is the depth cut inside the module. Every figure dated.
overview:
  - {k: "Exposure", num: "30<span>%</span>", lab: "of European jobs are in the top-25% most AI-exposed occupations (by generative-AI exposure); Sweden 39%, 2nd-highest of 36", foot: "DAIOE genAI v2023 · EU-LFS", anchor: "#exposure", cls: ""}
  - {k: "Demand",   num: "1.9<span>%</span>", lab: "median share of job ads requiring AI across 22 countries in 2025 (Stanford AI Index); Sweden 2.8%", foot: "AI Index / Lightcast · 2025", anchor: "#demand", cls: "b"}
  - {k: "Adoption", num: "20<span>%</span>", lab: "of EU firms used AI in 2025, up from 8% in 2023 (Eurostat); Sweden 35%, among the leaders", foot: "Eurostat · 2025", anchor: "#adoption", cls: "c"}
  - {k: "Outcomes", num: "−5.3<span>pp</span>", lab: "Sweden's entry-level squeeze: fewer entry-level openings in the most AI-exposed jobs since 2020; descriptive, and not separable here from the interest-rate cycle", foot: "JobTech · 2020–2025", anchor: "#outcomes", cls: "d"}
  - {k: "Capability", num: "12–17<span>h</span>", lab: "the longest human-expert tasks frontier AI agents complete at even odds; the length has been doubling every 4–6 months", foot: "METR · May 2026", anchor: "#capability", cls: "e"}


# The AI in Demand module.
aiindemand_lede: >-
  How often Swedish employers ask for AI skills in their job ads, by year, by occupation, and
  soon by whether they want AI built, integrated, or simply used. We name the series by what
  the employer does, never by what the job is: ads that ask for AI skills, ads that name an
  AI skill. We deliberately avoid the phrase "AI jobs".

# Plain-language captions (Harford test). Use verbatim beneath every figure of each series.
captions:
  floor: >-
    The share of Swedish job ads that ask the person being hired to work with AI, naming a
    specific skill such as machine learning in the job's own requirements.
  specific: >-
    The share of Swedish job ads that mention a specific AI skill, such as machine learning,
    anywhere in the ad.
  guard: >-
    Ads that mention AI only when describing the company do not count; an ad counts for what
    it asks of the person being hired.
  floor_sv: >-
    Andelen svenska platsannonser som ber den som anställs att arbeta med AI, med en namngiven
    färdighet som maskininlärning bland tjänstens egna krav.
  specific_sv: >-
    Andelen svenska platsannonser som nämner en specifik AI-färdighet, som maskininlärning,
    någonstans i annonsen.

# Trend: the frozen-v1 series (fp 2f073672be5d998c). Two lines:
# values = ads that NAME a specific AI skill (whole text); floor_values = ads that ASK for
# AI skills in the role's own requirements. 2026 appended as H1-partial when Q1/Q2 land.
trend:
  years:  [2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
  # v1.1, distinct advertisements (data/bulk_v11/derived/series_annual.csv, 2026 = H1).
  # The v1 raw-record series is retained as the robustness line in series_annual_raw.csv.
  values: [0.050, 0.065, 0.063, 0.088, 0.074, 0.093, 0.096, 0.085, 0.105, 0.129, 0.175, 0.250, 0.455, 0.712, 0.781, 0.795, 0.762, 0.746, 0.941, 1.066, 1.214]
  floor_values: [0.019, 0.028, 0.027, 0.020, 0.024, 0.034, 0.032, 0.026, 0.035, 0.058, 0.085, 0.120, 0.207, 0.296, 0.333, 0.348, 0.340, 0.341, 0.425, 0.521, 0.569]
  provisionalFrom: 20   # 0-based index of the first provisional point (2026, when appended)
  ymax: 1.5
  yticks: [0, 0.5, 1, 1.5]

tiles:
  - {num: "1.07<span>%</span>", lab: "of 2025 job advertisements name a specific AI skill; 0.52% ask for it in the job's own requirements", foot: "frozen v1.1 · 2025 · distinct ads", cls: ""}
  - {num: "21×", lab: "rise since 2006 in ads naming an AI skill (0.05% → 1.07%); the strict floor rose 27×", foot: "2006–2025 · Platsbanken", cls: "b"}
  - {num: "28.7", lab: "ads per 10,000 named a generative-AI skill in 2025, from near zero before 2023", foot: "27% of AI demand", cls: "c"}
  - {num: "−5.3<span>pp</span>", lab: "fewer entry-level openings in the most AI-exposed occupations; descriptive, and not separable from the rate cycle", foot: "widening since 2020", cls: "d"}

# The live 60-day window: its own instrument, never a point on the archive line (no-splice).
livewindow:
  asof: "24 Jul 2026"
  n: "35,600"
  names_pct: "1.85"
  floor_pct: "0.89"
  sentence: >-
    Of the 35,600 most recent job ads, 1.85% name a specific AI skill and 0.89% ask for one in
    the job itself (each figure give or take about a tenth of a percentage point). These numbers
    run a little higher than the chart's, for two reasons we have measured: the live feed
    carries a somewhat different mix of ads than the yearly archives, and the archives store
    slightly shortened ad texts. Once we can calibrate the two against each other, they will
    join into one line that runs to today.

# Top ADVERTISEMENT TITLES (verbatim, from the candidate extracts: floor_top_titles.csv),
# plus taxonomy-level churn. Free-text neologism newcomers: next release.
titles:
  flag: "Ad titles · verbatim"
  intro: >-
    Where the demand sits, in the employers' own words. The same titles head the list year
    after year: machine learning engineer, data scientist, AI/ML developer. One entry is a
    measurement artefact worth naming: medicinsk sekreterare appears because those ads
    mention speech-recognition software, and our classifier judges almost all of them to be
    describing a tool the job uses rather than an AI skill it asks for. The newcomers column
    is the language at work: job titles crossing three ads in a year for the first time.
  top:
    - {year: "2026 · H1", items: ["Machine learning engineer", "Data scientist"]}
    - {year: 2025, items: ["AI/ML-utvecklare (AI/ML developer)", "Machine learning engineer"]}
    - {year: 2024, items: ["Machine learning engineer", "Data scientist"]}
  newcomers:
    label: "New titles in AI demand"
    items: ["AI ambassador (2023)", "AI content producer (2023)", "AI-experter / AI experts (2024)", "AI lead (2025)", "AI data annotation specialist (2025)", "Senior agentic AI developer (2026)"]
  cooled:
    label: "Cooled: no longer clear the bar"
    items: ["Telemarketer (2018)", "Construction engineer (2022)", "Mathematical statistician (2023)", "Inside sales (2024)", "Network technician (2024)"]
  caveat: >-
    Top titles and the newcomer list are the advertisements' own headlines, as employers
    wrote them (lightly cleaned: employer and place names removed), with an English gloss
    where the employer wrote in Swedish; top titles are counted
    among ads that ask for AI skills in the role itself, and a newcomer's year is the first
    in which at least three ads carry that title. The cooled list still uses the employment
    service's occupation taxonomy (our English renderings), where an occupation "clears the
    bar" with at least five AI-skill ads in a year. A vacancy posted more than once counts
    each time.

segmentation:
  flag: "First release · measured to Jun 2026"
  intro: >-
    Every ad that asks for AI skills in the role itself, 2023 to mid-2026, classified by
    what the worker is hired to do with AI. A language-model classifier applies the lab's
    written labelling rules; it agrees with our hand-labelled reference ads 89 per cent of
    the time on the four-way split and 94 per cent on the grouping shown here. The
    headline: employers still mostly hire people to build AI, but the fastest-growing tier
    is people hired to simply use it.
  cards:
    - {name: "Builders",    color: "--c1", text: "Create AI: ML engineers, data scientists, applied-ML research. Half of strict AI-skill ads and steady: 46% in 2023, 51% in the first half of 2026."}
    - {name: "Integrators", color: "--c2", text: "Wire AI in and shape its adoption: architects, MLOps, adoption champions. Growing: 17% in 2023, 23% in the first half of 2026."}
    - {name: "Users",       color: "--c3", text: "Use AI as a tool of an otherwise non-AI job: admin, marketing, care, teaching. Small but rising fastest: 1% in 2023, 9% in the first half of 2026, and climbing quarter on quarter."}

caveats:
  - "<b>2026 is partial</b>: the first half comes from the Q1–Q2 archives and the latest weeks from the live feed; the newest point will revise."
  - "The chart ends with the June archives; the live feed runs to today and joins the chart once the two sources are reconciled."
  - "<b>The 2022–2023 dip</b> coincides with the global tech-hiring downturn and a sharp expansion of total ad volume: read it as a market swing, not necessarily as falling AI intent per employer."
  - "The headline lines are deliberately strict: roughly 2.5 times as many ads mention AI in some form. That broad bound mixes genuine demand with company boilerplate in proportions that drift over time, so we publish it only after an era-specific correction, now in progress."
  - "Ads that mention AI only when describing the company never count; an ad counts for what it asks of the person being hired."
  - "Counts are advertisement entries as they appear in the public archives; the same vacancy can be posted more than once."
  - "The builder / integrator / user split is classifier-based (validated against hand-labelled ads at 89% on the four-way split); a small share of ads sits in an AI-literacy penumbra outside the three tiers, and a reconciliation of the classifier's strictness against our hand-labelled benchmark is in progress. Shares may move a little; the ranking and trends are robust."

# Module 5 (minor): AI capability — external series, summarised quarterly.
# Verified 25 Jul 2026; sources + method in ai-monitor/notes/ai-performance-module_2026-07-25.md.
capability:
  flag: "External series · refreshed quarterly"
  intro: >-
    Everything above measures AI in the labour market; this small module tracks the
    technology itself, in the most work-relevant unit there is: how much human working
    time a single AI run can replace. The frontier is jagged, and it moves fast: on novel
    interactive worlds, where the goal must be inferred without instructions, the best
    system scored under 1% at the benchmark's launch and 30% by July 2026, against 100%
    for humans. Frontier capability is also what our DAIOE exposure measure tracks on the
    technology side.
  facts:
    - {num: "12–17 h", lab: "Longest tasks frontier AI agents complete at even odds, in human-expert time", foot: "METR Time Horizon 1.1 · May 2026"}
    - {num: "×2 every 4–6 mo", lab: "How quickly that task length has been doubling (faster since 2023)", foot: "METR · doubling time · May 2026"}
    - {num: "5× per year", lab: "Growth of computing power used to train frontier models, since 2020", foot: "Epoch AI · Feb 2026"}
    - {num: "100% vs 30%", lab: "Humans vs frontier AI on novel interactive worlds: explore, infer the goal, plan, with no instructions (was under 1% at launch)", foot: "ARC-AGI-3 · Jul 2026"}
  links:
    - {label: "METR time horizons", url: "https://metr.org/time-horizons/"}
    - {label: "Epoch AI trends", url: "https://epoch.ai/trends"}
    - {label: "Stanford AI Index", url: "https://hai.stanford.edu/ai-index"}
    - {label: "ARC Prize", url: "https://arcprize.org/arc-agi"}
  caveat: >-
    These are external research series, quoted with their dates; we summarise, we do not
    produce them. Figures refresh with the sources' own releases.
