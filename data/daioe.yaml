# DAIOE — the lab's Dynamic AI Occupational Exposure measure and its public tools.
headline: "DAIOE"
tagline: "Dynamic AI Occupational Exposure"
lede: >-
  DAIOE measures how exposed each occupation is to artificial intelligence, from data rather than
  expert guesswork. It tracks AI capability subdomains annually since 2010, capturing the potential
  applicability of AI capabilities to occupational content, not job-loss forecasts or adoption
  probabilities. It is openly published and citable (Zenodo,
  doi:10.5281/zenodo.21873968), versioned, and mapped across the US (SOC), international
  (ISCO) and Swedish (SSYK) classifications, so others can use it directly.

# FAQ — ported verbatim from the old ai-econlab.com/ai-exposure-daioe page (typos fixed). VERIFY.
faq:
  - {q: "Does “exposure” mean automation or job loss?", a: "No. DAIOE measures how applicable AI’s advancing capabilities are to what an occupation does. Whether that changes jobs depends on adoption, complements and organisational choices."}
  - {q: "Is it a forecast of AI adoption?", a: "No. DAIOE captures potential applicability. If, when and how AI is applied in an occupation depends on the cost of acquiring, adapting and using the technology, the institutional setting (laws and regulations), and more."}
  - {q: "What is different about DAIOE versus prior indices?", a: "DAIOE is dynamic and grounded in measured AI benchmark progress: the score moves year by year as AI capabilities actually advance, rather than scoring each occupation once. It tracks separate capability subdomains over time and down-weights socially intensive work (see below)."}
  - {q: "How do I read the raw score values?", a: "The index has no natural units: a value is meaningful only relative to other occupation-years. For cross-sectional standing, use within-year percentiles. One caution: v1.0.0’s rank columns can order occupations with identical values arbitrarily, so where ties could matter compute the tie-safe midrank instead (one line: 100 × average rank within year / count); from v1.1.0 it ships precomputed. Percentiles are ordinal, so they do not show how much exposure has grown; for level and growth, rescale as in the next question."}
  - {q: "Can I express scores relative to the most exposed occupation?", a: "Yes: divide by the highest value in the frozen 2010 to 2023 panel you use and multiply by 100 (score_rel_max = 100 x value / max). A score then reads as per cent of the most exposed occupation-year, and growth survives: an occupation at 31 in 2015 and 62 in 2023 doubled its exposure. Keep the 2010 to 2023 maximum as the denominator for later vintages too; values above 100 then mean exposure beyond the frozen-window peak. We document this transformation rather than shipping it, so the raw values remain the single citable version; details are in the technical documentation below."}
  - {q: "Which occupations tend to score highest?", a: "Cognitive, non-physical roles with lower social-interaction intensity, often white-collar, tend to rank higher."}
  - {q: "Do the data say anything about employment outcomes?", a: "Within Swedish firms, higher exposure predicts lower clerical support employment, an association absent in a pre-AI placebo period; skill ratios rise with exposure in Denmark and Portugal. There is no robust association with total employment. See the working paper for the full evidence and its limits."}
  - {q: "How do you handle interpersonal-heavy work?", a: "Through a down-weighting built into the measure. The abilities that generate the exposure score capture what AI can increasingly do, but they do not fully capture how interpersonal a job is, so DAIOE scores that separately: O*NET rates how important interpersonal skills are in each occupation and at what level the job requires them, and those ratings combine into a social-intensity score. The more social the job, the more its exposure is dialled down, because interpersonal work, from negotiation to care, is where automation gets the least grip: in an index without such an adjustment, clergy rank as strongly exposed, yet their work rests on sustained human relationships. The adjustment tempers exposure rather than erasing it, and the paper shows the results do not hinge on how strongly it is applied."}
  - {q: "What are the AI subdomains?", a: "Capability areas across games, vision and language, each tracked from its own public benchmarks. In the frozen 2010–2023 index: abstract strategy games and real-time video games; image recognition, image comprehension and image generation; reading comprehension, language modelling, translation and speech recognition. They aggregate into the overall index, and language modelling and image generation also combine into the generative-AI sub-index. Later vintages add subdomains as credible benchmarks emerge, and each vintage documents its own set."}
  - {q: "Can I compare across countries or industries?", a: "Yes. Combine occupation-level DAIOE with local workforce structures (firms, industries, regions) to assess exposure distributions."}
  - {q: "Is there a generative-AI version?", a: "Yes. We provide a generative-AI sub-index that combines language modelling and image generation."}
  - {q: "How do I cite DAIOE?", a: "Cite the release and the paper, and name the object you used. The scores carry a DOI per version (this version: 10.5281/zenodo.21873968; all versions: 10.5281/zenodo.21873967). v1.0.0 contains two objects, so cite the DOI plus the object (frozen 2010–2023 index, or 2024 refresh) plus the filename you loaded; the repository's CITATION.cff carries the machine-readable form."}
  - {q: "What is a vintage, and which should I use?", a: "A vintage is one released version of the dataset, labelled by its coverage window; vintages are separate, citable objects and are not interchangeable. Use the frozen 2010–2023 index to replicate or compare against published work, and the 2024 refresh for current analysis. The frozen window is carried cell-identically in every later vintage: published values never change."}
  - {q: "How do I standardise the scores the way the paper does?", a: "The bundle ships the frozen 2010–2020 moments (standardisation_moments_v1.csv: mean and standard deviation per classification and column), so standardising is one line, z = (value − mean) / sd, and cannot be done on the wrong window."}
  - {q: "How do I get going quickly?", a: "The repository README opens with quick starts in Python and Stata: the full ranking of occupations with percentiles, top and bottom ten with titles, and one occupation's exposure path over time. A code–title lookup for the Swedish classifications ships in the bundle."}
  - {q: "Will DAIOE be updated, and what happens to old values?", a: "Yes, by annual vintages, with published values never changing: every release verifies cell by cell that the frozen window is identical, and all basket and membership changes take effect at annual chain points, the convention of chain-linked official statistics. A 2025 vintage is forthcoming as v1.1.0, adding agentic task execution and mathematical and scientific reasoning, with companion composites in standardised units."}

# The live interactive tools (Shiny for Python on Hugging Face). Built and maintained in-house.
# Named "Occupations Explorer" on the site: primarily employment by occupation over time (and, soon,
# region), with DAIOE exposure as one overlay — so "DAIOE Explorer" would over-state the exposure part.
explorers:
  - name: "Occupations Explorer · yearly"
    desc: "Yearly Swedish employment by occupation group, with DAIOE AI-exposure levels overlaid."
    embed: "https://ai-econ-lab-daioe-explorer-years.hf.space"
    open: "https://huggingface.co/spaces/ai-econ-lab/daioe-explorer-years"
  - name: "Occupations Explorer · monthly"
    desc: "Monthly Swedish employment by occupation group, with DAIOE AI-exposure levels overlaid."
    embed: "https://ai-econ-lab-months.hf.space"
    open: "https://huggingface.co/spaces/ai-econ-lab/months"

resources:
  - {label: "DAIOE scores on Zenodo (citable, all versions)", href: "https://doi.org/10.5281/zenodo.21873968", note: "the canonical, versioned release; cite the vintage you use"}
  - {label: "Construction pipeline (open source)", href: "https://github.com/Magnus-L/daioe-pipeline", note: "code, test suite, quick starts in Python and Stata"}
  - {label: "Technical documentation (construction, vintages, reading the scores)", href: "https://github.com/Magnus-L/daioe-pipeline/blob/main/DOCUMENTATION.md", note: "the release's public reference"}
  - {label: "SSYK 2012 & SSYK 96 translation utility", href: "https://github.com/ai-econ-lab/daioe_translations", note: "crosswalk helper"}

paper:
  title: "AI Unboxed and Jobs: A Novel Measure and Firm-Level Evidence from Three Countries"
  note: "The working paper introducing and validating the measure."
